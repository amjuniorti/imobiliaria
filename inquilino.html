<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área do Inquilino | Sua Casa Imóveis</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/inquilino.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <header class="header">
        <div class="container nav-container">
            <a href="index.html" class="logo">Sua Casa <span>Imóveis</span></a>
            <button class="menu-toggle" id="menu-toggle"><i class="fa-solid fa-bars"></i></button>
            <nav class="nav" id="nav">
                <a href="index.html">Ver Site</a>
                <button class="btn-tema" id="btn-tema"><i class="fa-solid fa-moon" id="icone-tema"></i></button>
                <a href="#" id="btn-sair" style="color: #fc8181; font-weight: bold;"><i class="fa-solid fa-right-from-bracket"></i> Sair</a>
            </nav>
        </div>
    </header>

    <main class="dashboard-main">
        <div class="dashboard-header">
            <h1><i class="fa-solid fa-house-user"></i> Área do Inquilino</h1>
            <span style="color: var(--text-muted);" id="nome-inquilino">Carregando...</span>
        </div>

        <div class="card-locado">
            <div class="card-locado-img"></div>
            <div class="card-locado-info">
                <h2>Casa a Venda 3 Quartos</h2>
                <p><i class="fa-solid fa-location-dot"></i> Centro, São Paulo - SP</p>
                <div class="info-row">
                    <div class="info-item"><i class="fa-solid fa-bed"></i> 3 Quartos</div>
                    <div class="info-item"><i class="fa-solid fa-bath"></i> 2 Banheiros</div>
                    <div class="info-item"><i class="fa-solid fa-car"></i> 1 Vaga</div>
                </div>
                <div style="margin-top: 10px;">
                    <span class="status-badge status-pago" style="padding: 8px 16px; font-size: 14px;">Contrato Ativo</span>
                </div>
            </div>
        </div>

        <div class="box-boleto">
            <h3><i class="fa-solid fa-file-invoice-dollar"></i> Próximo Pagamento</h3>
            <div class="boleto-atual">
                <div>
                    <div class="boleto-valor">R$ 2.500,00</div>
                    <div class="boleto-vencimento">Vencimento: 10/11/2026</div>
                </div>
                <button class="btn-boleto" onclick="gerarBoleto()">
                    <i class="fa-solid fa-barcode"></i> Gerar 2ª Via do Boleto
                </button>
            </div>
        </div>

        <div class="box-ocorrencia">
            <h3><i class="fa-solid fa-screwdriver-wrench"></i> Abrir Chamado de Manutenção</h3>
            <form class="form-ocorrencia" id="form-ocorrencia">
                <input type="text" id="ocorrencia-titulo" placeholder="Assunto (Ex: Torneira vazando)" required>
                <textarea id="ocorrencia-desc" rows="4" placeholder="Descreva o problema com detalhes..." required></textarea>
                <button type="submit" class="btn-boleto" style="background: var(--accent-color);">
                    <i class="fa-solid fa-paper-plane"></i> Enviar Ocorrência
                </button>
            </form>
        </div>
    </main>

    <script src="js/inquilino.js"></script>
</body>
</html>
